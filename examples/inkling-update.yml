name: Inkling Update

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inkling
        run: npm install --global inkling

      - name: Run Inkling
        run: inkling --update --print
        env:
          # TODO: Replace with your preferred inference provider and model
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INKLING_MODEL_ID: z-ai/glm-5.2
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: inkling
          LANGCHAIN_TRACING_V2: "true"

      - name: Create Inkling update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: inkling
          branch: inkling/update
          commit-message: "docs: update Inkling"
          title: "docs: update Inkling"
          body: |
            Automated Inkling documentation update.

            This PR was generated by the scheduled Inkling workflow.
